[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-finder"
version = "0.1.0"
description = "Pygame maze/pathfinding visualizer"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5,<3",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src-layout: put the package on sys.path so `pytest` works from the repo
# root without an editable install or an exported PYTHONPATH.
pythonpath = ["src"]
testpaths = ["tests"]
